name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests unitaires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore backend/Nexus.sln

      - name: Build
        run: dotnet build backend/Nexus.sln -c Release --no-restore

      # Les tests d'intégration exigent Postgres + Neo4j : exclus de la CI unitaire.
      - name: Tests unitaires
        run: dotnet test backend/tests/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Integration"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
