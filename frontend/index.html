        <h1>Lenexus — Intelligence des dépendances et d’impact opérationnel</h1>
        <p><strong>Lenexus</strong> cartographie vos systèmes, fournisseurs, personnes et intelligences artificielles
        en un <strong>graphe de dépendances vivant</strong>, révèle vos <strong>points uniques de défaillance</strong>,
        simule pannes, cyberattaques et décisions, et en <strong>chiffre l’impact financier</strong>. C’est une couche
        d’intelligence au-dessus de vos outils existants (ERP, ITSM, CRM) — pas un remplaçant. Tous les chiffres sont
        déterministes et traçables ; l’IA résout, reformule et explique, sans jamais inventer les chiffres.</p>

        <h2>Le problème</h2>
        <p>Votre ERP connaît les fournisseurs, l’ITSM les serveurs, le RH les personnes, votre plateforme IA les
        modèles et agents. Mais quand un fournisseur tombe, qu’un employé clé part ou qu’un service cloud est
        compromis, la question — « qu’est-ce qui casse, jusqu’où, et combien ça coûte ? » — traverse tous ces silos.
        Aucun outil, seul, n’y répond.</p>

        <h2>Comment ça marche</h2>
        <ol>
          <li><strong>Importer</strong> — CSV, Excel, API REST en direct ou données collées structurées par l’IA.</li>
          <li><strong>Cartographier</strong> — systèmes, fournisseurs, personnes et IA deviennent un graphe unique.</li>
          <li><strong>Révéler</strong> — points uniques de défaillance, concentration et rayon d’impact, score expliqué.</li>
          <li><strong>Simuler</strong> — rejouez une panne, une cyberattaque ou une décision ; l’impact se propage et se chiffre.</li>
          <li><strong>Décider</strong> — mitigations priorisées et rapport exécutif.</li>
        </ol>

        <h2>Capacités de la plateforme</h2>
        <ul>
          <li>Graphe de dépendances 2D et hologramme 3D ; exploration des dépendances directes et transitives.</li>
          <li>Analyse de risque : score 0–100 en six facteurs, points uniques de défaillance (SPOF), alerte anticipée, impact de changement.</li>
          <li>Impact transversal en langage naturel ; simulation holographique (10 types de panne) ; cyberattaque avec kill-chain et contre-mesures.</li>
          <li>Modèle d’entreprise décisionnel éditable (compte de résultat, trésorerie, KPIs) avec historique versionné ; décision en langage naturel.</li>
          <li>Résilience : concentration des fournisseurs, dépendances humaines (« bus factor »), plan d’action.</li>
          <li>IA &amp; connaissance : analyste IA ancré sur le graphe, dépendances inférées à valider, extraction depuis documents, dépendances IA.</li>
          <li>Données &amp; sécurité : import CSV/Excel/REST, résolution d’entités, isolation multi-tenant, SSO Entra ID, Loi 25 / RGPD.</li>
        </ul>
