# NEXUS — environnement de développement local (article 76 du master prompt)
# Démarrage :  docker compose up -d
#
# Services :
#   postgres  : état applicatif + pgvector (embeddings RAG)   -> localhost:5432
#   neo4j     : knowledge graph + Graph Data Science (algos)  -> localhost:7474 (UI) / 7687 (bolt)
#   azurite   : émulateur Azure Blob Storage                  -> localhost:10000

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/data/postgres:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexus_dev_pwd}
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - ./deploy/data/neo4j/data:/data
      - ./deploy/data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: nexus-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --loose"
    ports:
      - "10000:10000"   # Blob
    volumes:
      - ./deploy/data/azurite:/data
